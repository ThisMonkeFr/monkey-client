# Builds Monkey Client for Windows, macOS and Linux and attaches the
# installers to a GitHub release.
#
# macOS installers can only be produced on a Mac, so this runs the build on
# GitHub's macOS runners rather than your PC. Free for public repositories.
#
# To cut a release: bump "version" in package.json, commit, then run
#   git tag v0.3.2 && git push origin v0.3.2
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
