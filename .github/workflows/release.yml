# Builds Monkey Client for Windows, macOS and Linux and attaches the
# installers to a GitHub release.
#
# macOS installers can only be produced on a Mac, so this runs the build on
# GitHub's macOS runners rather than your PC. Free for public repositories.
#
# Run it from the Actions tab (Run workflow), or push a version tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No npm cache here on purpose: caching needs a package-lock.json in the
      # repo, and its absence fails the whole job before anything is built.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
