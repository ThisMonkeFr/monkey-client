        <div>Preview session. No Microsoft token is held.</div></div>`:''}
      <div class="h5">Signed in accounts</div>
      ${list.length ? list.map(a=>`
        <div class="prow stone" style="margin-bottom:8px;padding:9px 11px">
          <img src="https://mc-heads.net/avatar/${encodeURIComponent(a.name)}/64"
            style="width:36px;height:36px;border-radius:8px;image-rendering:pixelated" alt="">
          <div class="pinfo"><h4 style="font-size:13.5px">${esc(a.name)}
            ${a.active?'<span class="tag leaf">Playing</span>':''}</h4></div>
          ${a.active?'' : `<button class="btn pri" data-act="switch-account" data-id="${a.uuid}">Switch</button>`}
          <button class="btn dang" data-act="signout" data-id="${a.uuid}" title="Sign out">${svg('logout',14)}</button>
        </div>`).join('')
        : `<p style="color:var(--mute);font-size:12.5px">No accounts stored.</p>`}
    </div>
    <div class="mf">
      <button class="btn" data-act="add-account">${svg('plus',15)}Add another account</button>
      ${S.account?`<button class="btn dang" data-act="signout">${svg('logout',15)}Sign out</button>`:''}
    </div></div>`, {key:'accounts'});
}

function fmtSince(ms){
  const s=Math.max(0,Math.floor((Date.now()-ms)/1000));
  if(s<60) return s+'s';
  const m=Math.floor(s/60);
  if(m<60) return m+'m '+(s%60)+'s';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function instanceRows(){
  const list = S.instances || [];
  if(!list.length && S.launching) return `<div class="prow stone">
    <div class="picon">${picon((sel()||{}).icon||'grass',26)}</div>
    <div class="pinfo"><h4>${esc((sel()||{}).name||'Starting')}</h4>
      <div class="meta"><span class="tag">Starting</span>
        <span>${esc(S.launching.step||'Preparing')}</span>
        <span>·</span><span class="num">${S.launching.pct||0}%</span></div></div>
  </div>`;
  if(!list.length) return `<div class="empty" style="margin:16px auto">
    <div class="ill">${svg('monitor',60)}</div><h3>Nothing running</h3>
    <p>Games you launch appear here with how long they have been open.</p></div>`;
  return list.map(i=>`<div class="prow stone" style="margin-bottom:9px">
    <div class="picon">${svg('play',22)}</div>
    <div class="pinfo"><h4>${esc(i.profile||i.name||'Minecraft')}</h4>
      <div class="meta"><span class="tag leaf">Running</span>
        <span>open for ${fmtSince(i.startedAt)}</span>
        <span>·</span><span class="num">PID ${i.pid}</span></div></div>
    <button class="btn" data-act="view-log">${svg('folder',14)}Log</button>
    <button class="btn dang" data-act="kill">${svg('power',14)}Close</button>
  </div>`).join('');
}
function instancesModal(){
  openModal(`<div class="modal" style="max-width:520px">
    <div class="mh">${svg('monitor',18)}<h3>Running instances</h3>
      <button class="btn ghost" data-act="close">${svg('x',16)}</button></div>
    <div class="mb" id="instbody">${instanceRows()}</div></div>`, {key:'instances'});
  /* Ask the main process directly rather than trusting the cached list, and
     keep the timer ticking while the dialog is open. */
  const refresh = async () => {
    const box=document.getElementById('instbody');
    if(!box){ clearInterval(window.__instTimer); window.__instTimer=null; return; }
    if(DESKTOP){ try{ S.instances = await window.monkey.game.instances() || []; }catch(e){} }
    box.innerHTML = instanceRows();
    renderChrome();
  };
  clearInterval(window.__instTimer);
  window.__instTimer = setInterval(refresh, 1000);
  refresh();
}

/* ============================================================
   Render + events
   ============================================================ */
let renderedTab=null, lastHtml='';
function render(){
  renderChrome();
  const map={play:pagePlay, profiles:pageProfiles, mods:pageMods, skins:pageSkins, friends:pageFriends};
  const html = (map[S.tab]||pagePlay)();
  const changingTab = renderedTab!==S.tab;
  if(changingTab){
    $('#view').innerHTML = html;
    const pg=$('#view .page'); if(pg) pg.classList.add('enter');
    renderedTab=S.tab;
  } else if(html!==lastHtml){
    morph($('#view'), html);          // in place: no flash, no scroll jump
  }
  lastHtml=html;
  if(S.tab==='skins') hydrateSkins();
  if(S.tab==='play'){ spinAttach(); bgAttach(); }
  const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight;
  const pq=$('#pq'); if(pq) pq.oninput = e=>{ pQuery=e.target.value; render(); $('#pq').focus(); };
  const mq=$('#mq'); if(mq){ mq.oninput=e=>{S.modQuery=e.target.value;};
    mq.onkeydown=e=>{ if(e.key==='Enter'){ S.modQuery=mq.value; searchMods(); } }; }
  const mi=$('#msgin'); if(mi) mi.onkeydown=e=>{ if(e.key==='Enter') sendMsg(); };
  const iq=$('#ignq'); if(iq) iq.onkeydown=e=>{ if(e.key==='Enter') fetchSkin(); };
}
function go(tab){
  if(S.tab===tab) return;
  S.tab=tab; S.pickerOpen=false;
  /* The Mods tab is for discovering new mods. A profile's own list is reached
     through the Mods button on its row in Profiles. */
  if(tab==='play' && bgCfg().effect==='random') rollBackground();
  if(tab==='mods'){
    S.modScope='browse';
    if(!S.modResults.length && !S.modLoading) fetchGameVersions().then(searchMods);
  }
  render();
}

document.addEventListener('click', async e => {
  const nav=e.target.closest('[data-tab]');
  if(nav){ SOUND.tab(); go(nav.dataset.tab); return; }
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='launch') SOUND.launch();
  else if(t.dataset.act==='close'||t.dataset.act==='cancel-signin') SOUND.close();
  else if(/^(ed-swatch|ed-tool|ed-model|ed-layer|ed-brush)$/.test(t.dataset.act)) SOUND.paint();
  else SOUND.tap();
  const a=t.dataset.act, id=t.dataset.id;

  switch(a){
    case 'close': closeModal(); break;
    case 'win-minimize': case 'win-maximize': case 'win-close':
      if(DESKTOP) window.monkey.window(a.replace('win-','')); break;
    case 'go-play': go('play'); break;
    case 'go-mods': go('mods'); break;
    case 'go-friends': go('friends'); break;
    case 'go-profiles': go('profiles'); break;
    case 'website':
      if(DESKTOP) window.monkey.openExternal(REPO);
      else window.open(REPO,'_blank');
      break;
    case 'open-folder': case 'open-mods-folder': {
      const p=sel();
      if(!p){ toast('Select a profile first','info'); break; }
      if(DESKTOP) await window.monkey.mods.openFolder(plain(p));
      else toast('Opening folders needs the desktop build','info');
      break; }

    /* auth */
    case 'signin': closeModal(); signInModal(); break;
    case 'cancel-signin':
      if(DESKTOP) window.monkey.auth.cancel();
      modalCleanup=null; closeModal(); break;
    case 'open-verify': if(DESKTOP) window.monkey.openExternal(t.dataset.uri); break;
    case 'preview-signin': previewSignIn(); break;
    case 'do-preview': {
      const name=($('#ign').value||'').trim()||'This_Monke';
      const r=await lookupPlayer(name);
      S.account={name:r.name||name, uuid:r.uuid||null, preview:true};
      seedNet(); save(); closeModal(); render(); loadMySkin();
      toast(`Preview session for ${S.account.name}`,'info'); break; }
    case 'account-menu': accountModal(); break;
    case 'switch-account': {
      if(!DESKTOP) break;
      toast('Switching account…','info');
      const r=await window.monkey.auth.switch(id);
      if(!r.ok){ toast(r.message,'err'); accountModal(); break; }
      S.account=r.account; S.mySkin=null; save();
      await loadMySkin(); render(); accountModal();
      toast(`Now playing as ${r.account.name}`); break; }
    case 'add-account':
      closeModal();
      if(DESKTOP) await realSignIn(); else signInModal();
      if(DESKTOP) S.accounts = await window.monkey.auth.accounts();
      break;
    case 'signout': {
      if(!DESKTOP){ closeModal(); signOut(); break; }
      const r=await window.monkey.auth.signOut(id||null);
      S.accounts = await window.monkey.auth.accounts();
      S.account = r.account || null;
      S.mySkin=null; netConnected = S.account ? netConnected : false;
      save();
      if(S.account){ await loadMySkin(); render(); accountModal(); toast(`Now playing as ${S.account.name}`); }
      else { closeModal(); signOut(); }
      break; }

    /* play */
    case 'toggle-picker': S.pickerOpen=!S.pickerOpen; render(); break;
    case 'pick-profile': S.selId=id; S.pickerOpen=false; save(); render(); break;
    case 'launch': launch(); break;
    case 'kill': if(DESKTOP){ await window.monkey.game.kill(); toast('Closing Minecraft','info'); } break;
    case 'quick-settings': {
      const p=sel();
      if(!p){ toast('No profile selected','info'); go('profiles'); break; }
      setTab='general'; settingsModal(p.id); break; }

    /* profiles */
    case 'pfilter':
      pFilter=t.dataset.k;
      document.querySelectorAll('[data-act="pfilter"]').forEach(b=>{
        const on=b.dataset.k===pFilter;
        b.classList.toggle('on',on); b.classList.toggle('stone',!on);
      });
      render(); break;
    case 'new-profile': newProfileModal(); break;
    case 'np-v': window.__np.v=t.dataset.v; newProfileModal(window.__np); break;
    case 'np-l': window.__np.l=t.dataset.l; newProfileModal(window.__np); break;
    case 'np-i': window.__np.i=t.dataset.i; newProfileModal(window.__np); break;
    case 'np-save': createProfile(window.__np); break;
    case 'select-profile': {
      S.selId=id; save();
      document.querySelectorAll('.prow[data-pid]').forEach(row=>{
        const on=row.dataset.pid===id;
        row.classList.toggle('sel',on);
        const b=row.querySelector('[data-act="select-profile"]');
        if(b){ b.disabled=on; b.classList.toggle('pri',!on);
          b.innerHTML=svg('check',14)+(on?'Selected':'Select'); }
      });
      lastHtml='';
      toast(`${S.profiles.find(x=>x.id===id).name} selected`); break; }
    case 'play-profile': S.selId=id; save(); go('play'); launch(); break;
    case 'profile-mods': S.selId=id; S.modScope='installed'; save(); go('mods'); render(); break;
    case 'profile-settings': setTab='general'; settingsModal(id); break;

    /* settings */
    case 'set-tab': setTab=t.dataset.k; settingsModal(setId); break;
    case 's-icon': {
      S.profiles.find(x=>x.id===setId).icon=t.dataset.i;
      document.querySelectorAll('[data-act="s-icon"]').forEach(b=>
        b.classList.toggle('on', b.dataset.i===t.dataset.i));
      break; }
    case 's-save': saveSettings(); break;
    case 's-delete': {
      const p=S.profiles.find(x=>x.id===setId);
      S.profiles=S.profiles.filter(x=>x.id!==setId);
      if(S.selId===setId) S.selId=S.profiles[0]?S.profiles[0].id:null;
      save(); closeModal(); render(); toast(`Deleted ${p.name}`); break; }

    /* mods */
    case 'modscope':
      S.modScope=t.dataset.k; S.tab='mods';
      if(S.modScope==='browse' && !S.modResults.length && !S.modLoading){ fetchGameVersions().then(searchMods); }
      render(); break;
    case 'modtab': S.modTab=t.dataset.k; searchMods(); break;
    case 'mod-search': S.modQuery=($('#mq')&&$('#mq').value)||''; searchMods(); break;
    case 'fgroup': S.openFilter = S.openFilter===t.dataset.k ? null : t.dataset.k; render(); break;
    case 'install': installMod(t.dataset.pid); break;
    case 'toggle-mod': {
      const p=sel(), m=p.mods.find(x=>x.id===t.dataset.mid);
      m.enabled = m.enabled===false;
      save(); render();
      if(DESKTOP) await window.monkey.mods.setEnabled(plain(p), m.fileName, m.enabled);
      toast(`${m.title} ${m.enabled?'enabled':'disabled'}`); break; }
    case 'rm-mod': {
      const p=sel() || S.profiles.find(x=>x.id===setId);
      const m=p.mods.find(x=>x.id===t.dataset.mid);
      p.mods=p.mods.filter(x=>x.id!==t.dataset.mid);
      save(); render();
      if(DESKTOP) await window.monkey.mods.remove(plain(p), m.fileName);
      toast(`Removed ${m.title}`); break; }

    /* skins */
    case 'upload-skin': pickFile('skin'); break;
    case 'upload-cape': pickFile('cape'); break;
    case 'fetch-skin': fetchSkin(); break;
    case 'apply-skin': {
      const skin=S.skins.find(x=>x.id===id);
      S.activeSkin=id;
      /* Show it on the stage straight away, at the right arm width. */
      if(skin.data){ S.mySkin={data:skin.data, slim:!!skin.slim}; await spinLoad(skin.data); }
      save(); render();
      if(!S.account){ toast('Applied locally. Sign in to push it to your account','info'); break; }
      if(!DESKTOP){ toast('Applied locally. Uploading needs the desktop build','info'); break; }
      if(!skin.data){ toast('Only uploaded or drawn skins can be uploaded','err'); break; }
      toast('Uploading to Mojang…','info');
      const up=await window.monkey.mc.uploadSkin(skin.data, skin.slim?'slim':'classic');
      toast(up.ok?'Skin applied to your account':up.message, up.ok?'ok':'err'); break; }
    case 'apply-cape': {
      S.activeCape = S.activeCape===id ? null : id;
      save(); await spinCape(); render();
      toast(S.activeCape?'Cape equipped':'Cape removed','info'); break; }
    case 'new-skin': edSetup('skin'); edRender(); break;
    case 'new-cape': edSetup('cape'); edRender(); break;
    case 'edit-skin': edSetup('skin', S.skins.find(x=>x.id===id)); edRender(); break;
    case 'edit-cape': edSetup('cape', S.capes.find(x=>x.id===id)); edRender(); break;
    case 'ed-tool': ED.tool=t.dataset.k; edSyncUI(); break;
    case 'ed-swatch':
      ED.color=t.dataset.c; ED.tool='pen';
      { const cw=document.querySelector('[data-act="ed-color"]'); if(cw) cw.value=ED.color; }
      edSyncUI(); break;
    case 'ed-model': ED.slim = t.dataset.k==='slim'; edSyncUI(); edPaint(); break;
    case 'ed-layer': ED.layer = t.dataset.k; edSyncUI(); edPaint(); break;
    case 'ed-undo':
      if(ED.undo.length){ ED.redo.push(ED.ctx.getImageData(0,0,64,64));
        ED.ctx.putImageData(ED.undo.pop(),0,0); edPaint(); edCounts(); }
      else toast('Nothing left to undo','info');
      break;
    case 'ed-redo':
      if(ED.redo.length){ ED.undo.push(ED.ctx.getImageData(0,0,64,64));
        ED.ctx.putImageData(ED.redo.pop(),0,0); edPaint(); edCounts(); }
      break;
    case 'ed-brush': ED.brush=parseInt(t.dataset.k); edSyncUI(); break;
    case 'ed-reset': ED.yaw=-0.5; ED.pitch=-0.12; ED.zoom=ED.kind==='skin'?11:13; edPaint(); break;
    case 'ed-clear':
      edPush(); ED.ctx.clearRect(0,0,64,64); edPaint(); break;
    case 'ed-save': edSave(); break;
    case 'set-model': {
      const sk=S.skins.find(x=>x.id===id); sk.slim = t.dataset.k==='slim';
      if(S.activeSkin===id && S.mySkin) S.mySkin.slim=sk.slim;
      save(); render(); break; }
    case 'del-skin': S.skins=S.skins.filter(s=>s.id!==id);
      if(S.activeSkin===id) S.activeSkin=null;
      save(); render(); toast('Skin removed'); break;
    case 'wear-cape':
      S.activeCape = S.activeCape===id ? null : id;
      save(); render();
      toast(S.activeCape
        ? 'Cape worn. Other players see it once the in-game mod ships'
        : 'Cape removed', 'info');
      break;
    case 'del-cape': S.capes=S.capes.filter(c=>c.id!==id); save(); render(); toast('Cape removed'); break;

    /* friends */
    case 'view-log': if(DESKTOP) await window.monkey.game.saveLog(); break;
    case 'instances': instancesModal(); break;
    case 'copy-log': {
      const log=(S.crash&&S.crash.log||[]).join('\n');
      try{ await navigator.clipboard.writeText(log); toast('Log copied'); }
      catch(e){ toast('Could not copy','err'); }
      break; }
    case 'save-log':
      if(DESKTOP){ const f=await window.monkey.game.saveLog(); toast('Saved to '+f); }
      break;
    case 'go-requests':
      if(!S.account){ toast('Sign in to see friend requests','err'); signInModal(); break; }
      requestsModal(); break;
    case 'add-friend': addFriendModal(); break;
    case 'do-add-friend': {
      const name=($('#afi').value||'').trim(), box=$('#aferr');
      if(!name){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>Enter a username first.</div></div>`; break; }
      box.innerHTML=`<p style="color:var(--mute);font-size:12.5px">Checking ${esc(name)}…</p>`;
      const r=await lookupPlayer(name);
      if(r.error==='notfound'){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>No Minecraft account named <b style="color:var(--tx)">${esc(name)}</b>. Check the spelling.</div></div>`; break; }
      if(r.error){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>Mojang is unreachable, so the username can't be verified right now.</div></div>`; break; }
      if(S.friends.some(f=>f.ign===r.name)){ box.innerHTML=`<div class="note">${svg('info',16)}<div>${esc(r.name)} is already your friend.</div></div>`; break; }
      const sent=await MonkeyNet.sendRequest(r.name);
      if(netConnected && !sent.ok){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>${esc(sent.message)}</div></div>`; break; }
      closeModal();
      if(netConnected){ toast(`Request sent to ${r.name}`); refreshNet(); }
      else toast(`${r.name} verified — start MonkeyNet to send the request`,'info');
      break; }
    case 'accept-req': {
      const r=S.requests.find(x=>x.id===id);
      if(netConnected){
        const res=await MonkeyNet.call('acceptRequest',id);
        closeModal();
        if(res.ok){ await refreshNet(); toast(`${r.ign} is now your friend`); } else toast(res.message,'err');
        break; }
      S.requests=S.requests.filter(x=>x.id!==id);
      S.friends.push({id:uid(),ign:r.ign,online:false,status:'Offline'});
      save(); requestsModal(); render(); toast(`${r.ign} is now your friend`); break; }
    case 'decline-req': {
      const r=S.requests.find(x=>x.id===id);
      if(netConnected){ await MonkeyNet.call('declineRequest',id); closeModal(); await refreshNet(); toast(`Declined ${r.ign}`,'info'); break; }
      S.requests=S.requests.filter(x=>x.id!==id);
      save(); requestsModal(); render(); toast(`Declined ${r.ign}`,'info'); break; }
    case 'open-chat': {
      S.openChat=id;
      document.querySelectorAll('[data-act="open-chat"]').forEach(b=>
        b.classList.toggle('on', b.dataset.id===id));
      render();
      if(netConnected){ const h=await MonkeyNet.call('history',id); if(h.ok){ S.chats[id]=h.data.messages; render(); } }
      break; }
    case 'send-msg': sendMsg(); break;

    case 'settings': launcherSettings(); break;
    case 'preset': {
      S.theme = {...PRESETS[t.dataset.k]};
      applyTheme(); save();
      ['accent','bg','panel'].forEach(k=>{
        const i=document.querySelector(`[data-act="theme-${k}"]`);
        if(i) i.value=S.theme[k];
      });
      toast(`${PRESETS[t.dataset.k].name} theme applied`); break; }
    case 'bg-pick': {
      const f = DESKTOP ? await window.monkey.pickPng(true) : await pickImageInBrowser();
      if(!f) break;
      S.bg = {data:f.data, opacity:(S.bg&&S.bg.opacity)??70, size:(S.bg&&S.bg.size)??100};
      save(); launcherSettings(); toast('Background set'); break; }
    case 'fx-effect': {
      const k=t.dataset.k;
      S.bgfx = {...bgCfg(), effect:k};
      BG.kind=null;                       // force the new effect to initialise
      if(k==='random') rollBackground();
      save();
      applyBackgroundNow();
      document.querySelectorAll('[data-act="fx-effect"]').forEach(b=>{
        const on=b.dataset.k===k;
        b.classList.toggle('on',on);
        const tick=b.querySelector('.tick');
        if(on && !tick) b.insertAdjacentHTML('afterbegin',`<span class="tick">${svg('check',12)}</span>`);
        if(!on && tick) tick.remove();
      });
      refreshFxControls();
      if(k==='image' && !(S.bg&&S.bg.data)) toast('Pick an image to use as your background','info');
      break; }
    case 'font-pick': {
      const f = DESKTOP ? await window.monkey.pickPng('font') : await pickFontInBrowser();
      if(!f) break;
      S.font={key:'custom', name:f.name, data:f.data};
      applyFont(); save(); launcherSettings();
      toast(`Using ${f.name}`); break; }
    case 'make-shortcut': {
      if(!DESKTOP){ toast('Shortcuts need the desktop build','info'); break; }
      const r=await window.monkey.app.shortcut();
      toast(r.ok ? 'Shortcut created on your desktop' : r.message, r.ok?'ok':'err');
      break; }
    case 'upd-check': {
      if(!DESKTOP){ S.updateMsg='Updates only work in the installed desktop build.'; launcherSettings(); break; }
      S.updateMsg='Checking for updates…'; launcherSettings();
      const r=await window.monkey.update.check();
      if(!r.ok){ S.updateMsg=r.message; launcherSettings(); }
      break; }
    case 'upd-install': if(DESKTOP) window.monkey.update.install(); break;
    case 'open-log': if(DESKTOP) window.monkey.logs.open(t.dataset.p); break;
    case 'copy-log': {
      if(!DESKTOP) break;
      const r=await window.monkey.logs.read(t.dataset.p);
      if(r.ok){ await navigator.clipboard.writeText(r.text); toast('Log copied to clipboard'); }
      else toast(r.message,'err');
      break; }
    case 'view-log': if(DESKTOP) await window.monkey.game.saveLog(); break;
    case 'instances': instancesModal(); break;
    case 'kill-instance':
      if(DESKTOP) await window.monkey.game.kill(t.dataset.k);
      instancesModal(); break;
    case 'bg-clear': S.bg=null; save(); launcherSettings(); toast('Background removed','info'); break;
    case 'theme-reset':
      S.theme = {...PRESETS.jungle}; applyTheme(); save(); launcherSettings();
      toast('Back to the default theme'); break;
    case 'wipe':
      Object.assign(S,{profiles:[],selId:null,skins:[],capes:[],friends:[],requests:[],
        chats:{},account:null,netSeeded:false,activeSkin:null});
      save(); closeModal(); S.tab='play'; render(); toast('Launcher data reset','info'); break;
  }
});

document.addEventListener('change', e => {
  const t=e.target.closest('[data-act]'); if(!t) return;
  const p=S.profiles.find(x=>x.id===setId);
  switch(t.dataset.act){
    case 'setfilter': S.modFilters[t.dataset.f]=t.dataset.v; searchMods(); break;
    case 'fx-animate': S.bgfx={...bgCfg(), animate:t.checked}; save(); break;
    case 'ui-sound': S.sound=t.checked; save(); if(t.checked) sfx('ok'); break;
    case 'keep-open': S.keepOpen=t.checked; save(); break;
    case 'ui-font': S.font={key:t.value}; applyFont(); save(); break;
    case 'ui-animate':
      S.uiAnim=t.checked;
      document.documentElement.classList.toggle('no-anim', !t.checked);
      save(); break;
    case 's-ram': p.settings.ram=parseInt(t.value); settingsModal(setId); break;
    case 's-cjava': p.settings.customJava=t.checked; settingsModal(setId); break;
    case 's-cargs': p.settings.customArgs=t.checked; settingsModal(setId); break;
    case 's-full': p.settings.fullscreen=t.checked; break;
    case 's-close': p.settings.closeOnLaunch=t.checked; break;
    case 's-pin': p.pinned=t.checked; break;
    case 's-version': p.version=t.value; settingsModal(setId); break;
    case 's-loader': p.loader=t.value; settingsModal(setId); break;
  }
});
document.addEventListener('input', e => {
  const bgc=e.target.closest('[data-act="bg-opacity"],[data-act="bg-size"],[data-act="bg-blur"]');
  if(bgc && S.bg){
    const key={'bg-opacity':'opacity','bg-size':'size','bg-blur':'blur'}[bgc.dataset.act];
    S.bg[key]=parseInt(bgc.value);
    const lbl=bgc.parentElement.querySelector('b');
    if(lbl) lbl.textContent=bgc.value+(key==='blur'?'px':'%');
    const layer=document.querySelector('.hero .bgimg');
    if(layer){
      layer.style.opacity=(S.bg.opacity??70)/100;
      layer.style.filter=`blur(${S.bg.blur??0}px)`;
      layer.style.backgroundSize=`${S.bg.size??100}% auto`;
    }
    save(); return;
  }
  const fxc=e.target.closest('[data-act="fx-speed"],[data-act="fx-blur"],[data-act="fx-size"]');
  if(fxc){
    const cfg=bgCfg(), v=parseInt(fxc.value);
    const key={'fx-speed':'speed','fx-blur':'blur','fx-size':'size'}[fxc.dataset.act];
    cfg[key] = key==='speed' ? v/100 : v;
    const lbl=fxc.parentElement.querySelector('b');
    if(lbl) lbl.textContent = key==='speed' ? cfg.speed.toFixed(1)+'x' : v+(key==='blur'?'px':'%');
    S.bgfx=cfg; save();
    const c=document.getElementById('bgfx');
    if(c) c.style.filter=`blur(${cfg.blur}px)`;
    applyBackgroundNow();
    return;
  }
  const ec=e.target.closest('[data-act="ed-color"]');
  if(ec){ ED.color=ec.value; return; }
  const c=e.target.closest('[data-act^="theme-"]');
  if(c){
    const key={'theme-accent':'accent','theme-bg':'bg','theme-panel':'panel'}[c.dataset.act];
    if(key){ S.theme={...(S.theme||PRESETS.jungle), [key]:c.value}; applyTheme(); save(); }
    return;
  }
  const t=e.target.closest('[data-act="s-ram"]'); if(!t) return;
  t.closest('.memcard').querySelector('div').textContent=`${t.value} MB (${(t.value/1024).toFixed(1)} GB)`;
});


/* ============================================================
   Editor — paint on the rotating model, on the shared renderer
   ============================================================ */
const ED = { kind:'skin', w:64, h:64, tool:'pen', color:'#8A6234', slim:false, layer:'base',
             brush:1, mirror:false, ctx:null, view:null, undo:[], redo:[], id:null, name:'',
             yaw:-0.5, pitch:-0.12, zoom:11, quads:[] };
const PALETTE = ['#000000','#3E3E3E','#7A7A7A','#C6C6C6','#FFFFFF','#7A2E24','#C4574A','#E8A08F',
                 '#5A3A1B','#8A6234','#C79A5E','#E0B87D','#2E4A1C','#4C7A32','#7CC24A','#B9E88A',
                 '#123A4A','#1F6C86','#3FB6D8','#9FE0F0','#3A1E5A','#6B3FA0','#A971E8','#D6BBF5',
                 '#5A4A10','#9A7C1C','#E5B33F','#F6DE9A','#2B2B38','#474761','#6E6E8F','#A8A8C4'];

/* A Steve-ish starting point: skin tone, blue trousers, cyan shirt, brown hair. */
function drawSteve(c){
  const R=(x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(x,y,w,h); };
  const SKIN='#B4886B', HAIR='#3F2A18', SHIRT='#00AAAA', PANTS='#3A3AAD', SHOE='#4A4A4A', EYE='#FFFFFF', IRIS='#3A3AAD';
  // head
  R(8,0,16,8,HAIR); R(0,8,32,8,SKIN);
  R(8,8,8,8,SKIN); R(8,8,8,3,HAIR); R(0,8,8,8,SKIN); R(16,8,8,8,SKIN); R(24,8,8,8,HAIR);
  R(9,12,2,2,EYE); R(13,12,2,2,EYE); R(10,12,1,2,IRIS); R(14,12,1,2,IRIS);
  R(11,14,2,1,'#8C5A3C');
  // torso + arms + legs
  R(16,16,24,16,SHIRT); R(20,20,8,12,SHIRT);
  R(40,16,16,16,SKIN); R(44,20,4,12,SHIRT); R(44,20,4,4,SHIRT);
  R(32,48,16,16,SKIN); R(36,52,4,12,SHIRT);
  R(0,16,16,16,PANTS); R(0,48,16,16,PANTS);
  R(4,28,4,4,SHOE); R(20,60,4,4,SHOE);
}
/* A plain cape: solid field with a lighter border, ready to paint over. */
function drawCape(c){
  c.fillStyle='#2C3E6B'; c.fillRect(0,0,22,17);
  c.fillStyle='#3A5490'; c.fillRect(1,1,10,16);
  c.fillStyle='#54709E'; c.fillRect(2,2,8,1); c.fillRect(2,14,8,1);
  c.fillRect(2,3,1,11); c.fillRect(9,3,1,11);
}

const edData = () => ED.ctx.canvas.toDataURL('image/png');
function edPush(){ ED.undo.push(ED.ctx.getImageData(0,0,64,64)); ED.redo.length=0;
                   if(ED.undo.length>60) ED.undo.shift(); edCounts(); }
function edCounts(){
  const u=document.getElementById('edundo'), r=document.getElementById('edredo');
  if(u) u.disabled=!ED.undo.length;
  if(r) r.disabled=!ED.redo.length;
}
function edPaint(){
  const v=ED.view; if(!v) return;
  const tex=ED.ctx.getImageData(0,0,64,64).data;
  ED.quads = MODEL.build(tex,{pickable:true, kind:ED.kind, slim:ED.slim, layer:ED.layer,
    yaw:ED.yaw, pitch:ED.pitch, zoom:ED.zoom, centreY: ED.kind==='cape'?16:17}, v.width, v.height);
  MODEL.paint(v, ED.quads);
  edMap();
}
/* Flat texture map beside the model, so you can see the whole sheet. */
function edMap(){
  const m=document.getElementById('edmap'); if(!m) return;
  const c=m.getContext('2d');
  c.imageSmoothingEnabled=false;
  c.clearRect(0,0,m.width,m.height);
  const t=8;
  for(let y=0;y<m.height;y+=t) for(let x=0;x<m.width;x+=t){
    c.fillStyle=((x/t+y/t)%2)?'#1b1b1b':'#252525'; c.fillRect(x,y,t,t);
  }
  c.drawImage(ED.ctx.canvas,0,0,m.width,m.height);
}
function edSetPixel(x,y){
  if(x<0||y<0||x>=64||y>=64) return;
  const c=ED.ctx;
  if(ED.tool==='eraser') c.clearRect(x,y,1,1);
  else { c.fillStyle=ED.color; c.fillRect(x,y,1,1); }
}
function edApply(q){
  if(!q) return;
  if(ED.tool==='picker'){
    const d=ED.ctx.getImageData(q.tx,q.ty,1,1).data;
    if(d[3]){
      ED.color=rgb2hex([d[0],d[1],d[2]]); ED.tool='pen';
      const cw=document.querySelector('[data-act="ed-color"]'); if(cw) cw.value=ED.color;
      edSyncUI();
    }
    return;
  }
  if(ED.tool==='fill'){ edFill(q.tx,q.ty); return; }
  const r=Math.floor(ED.brush/2);
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++) edSetPixel(q.tx+dx,q.ty+dy);
}
function edFill(sx,sy){
  const img=ED.ctx.getImageData(0,0,64,64), d=img.data, at=(x,y)=>(y*64+x)*4;
  const s0=at(sx,sy), tgt=[d[s0],d[s0+1],d[s0+2],d[s0+3]];
  const [r,g,b]=hex2rgb(ED.color);
  if(tgt[0]===r&&tgt[1]===g&&tgt[2]===b&&tgt[3]===255) return;
  const st=[[sx,sy]];
  while(st.length){
    const [x,y]=st.pop();
    if(x<0||y<0||x>=64||y>=64) continue;
    const i=at(x,y);
    if(d[i]!==tgt[0]||d[i+1]!==tgt[1]||d[i+2]!==tgt[2]||d[i+3]!==tgt[3]) continue;
    d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ED.ctx.putImageData(img,0,0);
}
function edSetup(kind, existing){
  ED.kind=kind; ED.tool='pen'; ED.layer='base'; ED.brush=1;
  ED.undo=[]; ED.redo=[];
  ED.id=existing?existing.id:null;
  ED.name=existing?existing.name:(kind==='skin'?'New skin':'New cape');
  ED.slim=existing?!!existing.slim:false;
  ED.yaw=-0.5; ED.pitch=-0.12; ED.zoom = kind==='skin'?11:13;
  const buf=document.createElement('canvas'); buf.width=64; buf.height=64;
  ED.ctx=buf.getContext('2d',{willReadFrequently:true});
  ED.ctx.imageSmoothingEnabled=false;
  if(existing && existing.data){
    const img=new Image();
    img.onload=()=>{ ED.ctx.drawImage(img,0,0); edPaint(); };
    img.src=existing.data;
  } else if(kind==='skin'){
    /* Start from the game's own default skin rather than a blank sheet. */
    edDefaultSkin();
  } else {
    edDefaultCape();
  }
}

/* Flip classes in place instead of rebuilding the modal, so the canvas,
   scroll position and rotation survive a click. */
function edSyncUI(){
  const mark=(sel,attr,val)=>document.querySelectorAll(sel).forEach(b=>
    b.classList.toggle('on', b.dataset[attr]===String(val)));
  mark('[data-act="ed-tool"]','k',ED.tool);
  mark('[data-act="ed-brush"]','k',ED.brush);
  mark('[data-act="ed-layer"]','k',ED.layer);
  mark('[data-act="ed-model"]','k',ED.slim?'slim':'classic');
  document.querySelectorAll('[data-act="ed-swatch"]').forEach(b=>
    b.classList.toggle('on', b.dataset.c.toLowerCase()===ED.color.toLowerCase()));
}

async function edDefaultSkin(){
  if(DESKTOP){
    const r = await window.monkey.mc.skin('MHF_Steve');
    if(r && r.data){
      const img=new Image();
      img.onload=()=>{ ED.ctx.drawImage(img,0,0); edPaint(); };
      img.src=r.data;
      return;
    }
  }
  // Offline fallback: flat Steve-ish blocking so nothing is invisible in game.
  const c=ED.ctx, put=(col,x,y,w,h)=>{ c.fillStyle=col; c.fillRect(x,y,w,h); };
  put('#00000000',0,0,64,64);
  put('#3F2E1F',8,0,16,8); put('#3F2E1F',0,8,32,8);          // hair
  put('#B4886B',8,8,8,8);                                    // face
  put('#00AAAA',20,20,8,12); put('#B4886B',20,16,8,4);       // shirt
  put('#B4886B',44,16,8,4); put('#B4886B',44,20,16,12);      // right arm
  put('#B4886B',36,48,8,4); put('#B4886B',36,52,16,12);      // left arm
  put('#3B3BB4',4,16,8,4);  put('#3B3BB4',0,20,16,12);       // right leg
  put('#3B3BB4',20,48,8,4); put('#3B3BB4',16,52,16,12);      // left leg
  put('#FFFFFF',9,12,2,1);  put('#FFFFFF',13,12,2,1);
  put('#3B3BB4',10,12,1,1); put('#3B3BB4',14,12,1,1);
  edPaint();
}
function edDefaultCape(){
  /* A plain cape template — Mojang's own cape art is theirs, so this is a
     neutral starting point you can paint over. */
  const c=ED.ctx;
  c.fillStyle='#7A2E24'; c.fillRect(1,1,10,16);
  c.fillStyle='#5C221B'; c.fillRect(1,1,10,1); c.fillRect(1,16,10,1);
  c.fillStyle='#8F3A2F'; c.fillRect(2,3,8,12);
  c.fillStyle='#7A2E24'; c.fillRect(0,1,1,16); c.fillRect(11,1,1,16);
  c.fillStyle='#5C221B'; c.fillRect(1,0,10,1); c.fillRect(12,1,10,16);
  edPaint();
}

function edRender(){
  const label = ED.kind==='skin'?'skin':'cape';
  const tool=(k,ic,t)=>`<button data-act="ed-tool" data-k="${k}" title="${t}"
    class="${ED.tool===k?'on':''}">${svg(ic,17)}<span>${t}</span></button>`;
  openModal(`<div class="modal ed-modal">
    <div class="mh">${svg('skins',18)}<h3>${ED.id?'Edit':'New'} ${label}</h3>
      <input type="text" id="edname" value="${esc(ED.name)}" class="ed-name">
      <button class="btn ghost" data-act="close">${svg('x',16)}</button></div>
    <div class="ed-body">
      <div class="ed-left">
        <div class="ed-toolbar">
          ${tool('pen','edit','Draw')}${tool('fill','mods','Fill')}
          ${tool('eraser','x','Erase')}${tool('picker','palette','Pick')}
        </div>
        <div class="ed-group">
          <label>Brush</label>
          <div class="seg">${[1,2,3].map(n=>`<button data-act="ed-brush" data-k="${n}"
            class="${ED.brush===n?'on':''}" style="flex:1;padding:6px 0">${n}px</button>`).join('')}</div>
        </div>
        ${ED.kind==='skin'?`
        <div class="ed-group"><label>Layer</label>
          <div class="seg">
            <button data-act="ed-layer" data-k="base" class="${ED.layer==='base'?'on':''}" style="flex:1;padding:6px 0">Body</button>
            <button data-act="ed-layer" data-k="overlay" class="${ED.layer==='overlay'?'on':''}" style="flex:1;padding:6px 0">Outer</button>
          </div></div>
        <div class="ed-group"><label>Model</label>
          <div class="seg">
            <button data-act="ed-model" data-k="classic" class="${ED.slim?'':'on'}" style="flex:1;padding:6px 0">Classic</button>
            <button data-act="ed-model" data-k="slim" class="${ED.slim?'on':''}" style="flex:1;padding:6px 0">Slim</button>
          </div></div>`:''}
        <div class="ed-group"><label>Texture map</label>
          <canvas id="edmap" width="192" height="192" class="ed-map"></canvas></div>
      </div>

      <div class="ed-centre">
        <canvas id="edcv" width="460" height="500"></canvas>
        <div class="ed-hint">Left mouse paints · right mouse or Shift turns · scroll zooms · double-click resets</div>
      </div>

      <div class="ed-right">
        <div class="ed-group"><label>Colour</label>
          <input type="color" value="${ED.color}" data-act="ed-color" class="ed-color">
          <div class="ed-swatches">
            ${PALETTE.map(c=>`<button data-act="ed-swatch" data-c="${c}"
              class="${ED.color.toLowerCase()===c.toLowerCase()?'on':''}" style="background:${c}"></button>`).join('')}
          </div></div>
        <div class="ed-group"><label>History</label>
          <div class="row" style="gap:7px">
            <button class="btn" id="edundo" data-act="ed-undo" style="flex:1;justify-content:center">${svg('back2',15)}Undo</button>
            <button class="btn" id="edredo" data-act="ed-redo" style="flex:1;justify-content:center">${svg('chevR',15)}Redo</button>
          </div>
          <button class="btn dang" data-act="ed-clear" style="width:100%;justify-content:center;margin-top:7px">
            ${svg('trash',15)}Clear everything</button>
        </div>
        <div class="ed-group"><label>View</label>
          <button class="btn" data-act="ed-reset" style="width:100%;justify-content:center">Reset rotation</button>
        </div>
      </div>
    </div>
    <div class="mf"><button class="btn" data-act="close">Cancel</button>
      <button class="btn pri" data-act="ed-save">Save ${label}</button></div></div>`,
    {key:'editor', dismissible:false});

  ED.view=document.getElementById('edcv');
  edPaint(); edCounts();

  let mode=null,last=null;
  const at=ev=>{ const r=ED.view.getBoundingClientRect();
    return [(ev.clientX-r.left)*ED.view.width/r.width,(ev.clientY-r.top)*ED.view.height/r.height]; };
  ED.view.addEventListener('contextmenu',e=>e.preventDefault());
  ED.view.addEventListener('pointerdown',ev=>{
    ED.view.setPointerCapture(ev.pointerId);
    if(ev.button===2||ev.shiftKey){ mode='orbit'; last=[ev.clientX,ev.clientY]; ED.view.style.cursor='grabbing'; return; }
    mode='paint'; edPush(); sfx('paint');
    const [x,y]=at(ev); edApply(MODEL.hit(ED.quads,x,y)); edPaint();
  });
  ED.view.addEventListener('pointermove',ev=>{
    if(mode==='orbit'){
      ED.yaw+=(ev.clientX-last[0])*0.012;
      ED.pitch=Math.max(-1.1,Math.min(1.1,ED.pitch+(ev.clientY-last[1])*0.009));
      last=[ev.clientX,ev.clientY]; edPaint(); return;
    }
    if(mode==='paint'&&ED.tool!=='fill'&&ED.tool!=='picker'){
      const [x,y]=at(ev); edApply(MODEL.hit(ED.quads,x,y)); edPaint();
    }
  });
  const up=()=>{ mode=null; ED.view.style.cursor='crosshair'; };
  ED.view.addEventListener('pointerup',up);
  ED.view.addEventListener('pointercancel',up);
  ED.view.addEventListener('dblclick',()=>{ ED.yaw=-0.5; ED.pitch=-0.12; edPaint(); });
  ED.view.addEventListener('wheel',ev=>{
    ev.preventDefault();
    ED.zoom=Math.max(5,Math.min(22,ED.zoom-Math.sign(ev.deltaY)));
    edPaint();
  },{passive:false});
  const nm=document.getElementById('edname');
  if(nm) nm.oninput=e=>{ ED.name=e.target.value; };
}

function edSave(){
  const data=edData();
  if(ED.kind==='skin'){
    const f=ED.id&&S.skins.find(x=>x.id===ED.id);
    if(f) Object.assign(f,{name:ED.name||f.name,data,slim:ED.slim,ign:undefined});
    else S.skins.push({id:uid(),name:ED.name||'New skin',data,slim:ED.slim});
  } else {
    const f=ED.id&&S.capes.find(x=>x.id===ED.id);
    if(f) Object.assign(f,{name:ED.name||f.name,data});
    else S.capes.push({id:uid(),name:ED.name||'New cape',data});
  }
  save(); closeModal(); S.tab='skins'; render(); toast(`Saved ${ED.name}`);
}

/* The stage canvases are sized in pixels, so they need refitting whenever the
   window changes — otherwise maximising leaves them at the old size. */
let resizeTimer=null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const c=document.getElementById('bgfx');
    if(c && c.parentElement){ c.width=c.parentElement.clientWidth; c.height=c.parentElement.clientHeight; }
    spinDraw();
  },80);
});

/* ---------- boot ---------- */
(async function(){
  await load();
  if(!S.theme) S.theme={...PRESETS.jungle};
  applyTheme(); applyFont();
  document.documentElement.classList.toggle('no-anim', S.uiAnim===false);
  S.profiles.forEach(p=>p.mods.forEach(m=>{ if(m.enabled===undefined) m.enabled=true; }));
  if(S.profiles.length && !S.profiles.find(p=>p.id===S.selId)) S.selId=S.profiles[0].id;
  S.tab='play'; S.launching=null; S.running=false;
  if(bgCfg().effect==='random') rollBackground(); S.pickerOpen=false;
  if(DESKTOP) loadMySkin();

  if(DESKTOP){
    window.monkey.auth.onRestored(acc=>{ S.account=acc; save(); render(); loadMySkin(); toast(`Welcome back, ${acc.name}`); });
    window.monkey.auth.onRestoreFailed(({message})=>{ S.account=null; render(); toast(message,'info'); });
    window.monkey.net.onStatus(({connected,message})=>{
      netConnected=connected;
      if(connected){ S.netSeeded=true; refreshNet(); }
      else if(message) toast('MonkeyNet: '+message,'info');
    });
    window.monkey.net.onEvent(handleNetEvent);
    window.monkey.update.onStatus(u=>{
      const msg = {
        available:`Update ${u.version} found — downloading…`,
        downloading:`Downloading update — ${u.percent}%`,
        ready:`Update ${u.version} is ready. Restart to apply it.`,
        current:'Monkey Client is up to date.',
        error:`Update check failed: ${u.message}`
      }[u.state];
      S.updateMsg=msg; S.updateReady = u.state==='ready';
      if(u.state==='ready') toast(msg,'info');
      const box=document.getElementById('updbox');
      if(box) box.lastElementChild.textContent=msg;
    });
    window.monkey.game.onProgress(p=>{
      const first = !S.launching;
      S.launching={pct:p.pct, step:p.detail};
      if(first){ render(); return; }
      const bar=document.querySelector('.progress .bar i'), txt=document.querySelector('.progress p');
      if(bar) bar.style.width=p.pct+'%';
      if(txt) txt.textContent=p.detail;
      else render();
    });
    window.monkey.game.onCrash(c=>{ S.crash=c; S.launching=null; S.running=false; render(); crashModal(c); });
    setInterval(pollInstances, 5000);
    window.monkey.game.onEvent(ev=>{
      if(ev.type==='running'){ S.launching=null; S.running=true; render(); toast('Minecraft is running'); }
      if(ev.type==='exit'){
        S.launching=null; S.running=false; pollInstances(); render();
        if(ev.code===0) toast('Minecraft closed');
      }
      if(ev.type==='error'){ S.launching=null; S.running=false; render(); toast(ev.message,'err'); }
    });
    window.monkey.auth.onAccounts(list=>{ S.accounts=list; renderChrome(); });
    const acc=await window.monkey.auth.account();
    if(acc){ S.account=acc; loadMySkin(); }
    S.accounts = await window.monkey.auth.accounts();
  }
  render();
})();
</script>
