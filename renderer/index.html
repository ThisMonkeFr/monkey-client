<meta charset="utf-8">
<style>
:root{
  --bg0:#070C09; --bg1:#0E1712; --bg2:#121D17;
  --surf:#16241C; --surf2:#1C2E23; --surf3:#233A2C;
  --line:#22382B; --line2:#2E5039;
  --tx:#E6EFE7; --dim:#8FA896; --mute:#5F7A68;
  --gold:#E5B33F; --gold2:#F6D283; --goldd:#7A5C1E;
  --leaf:#58C87E; --clay:#C9584C;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg0); color:var(--tx); overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:#3d6b4c}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:76px 1fr;height:100vh}

/* rail */
.rail{
  background:linear-gradient(180deg,#132019,#0D1712);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:4px;position:relative;z-index:5;
}
.mark{width:38px;height:38px;margin-bottom:16px;color:var(--gold);flex:none}
.navb{
  width:56px;padding:9px 0 7px;border-radius:12px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--mute);transition:color .16s,background .16s;
}
.navb svg{width:21px;height:21px}
.navb span{font-size:10.5px;letter-spacing:.01em}
.navb:hover{color:var(--dim);background:#18291F}
.navb.on{color:var(--gold);background:linear-gradient(180deg,rgba(229,179,63,.14),rgba(229,179,63,.05))}
.navb.on::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:26px;border-radius:0 3px 3px 0;background:var(--gold);
}
.rail .spacer{flex:1}

/* main */
.main{display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg1)}
.leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.leaf{position:absolute;color:#3E6B4E;opacity:.13;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translate(0,-40px) rotate(0deg)}
  100%{transform:translate(60px,105vh) rotate(220deg)}
}

/* titlebar */
.tb{
  height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;
  border-bottom:1px solid var(--line);background:rgba(13,23,18,.86);backdrop-filter:blur(6px);
  position:relative;z-index:4;
}
.nav-arrow{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.nav-arrow:hover:not(:disabled){background:var(--surf2);color:var(--tx)}
.nav-arrow:disabled{opacity:.3;cursor:default}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-left:4px}
.brand b{font-size:17.5px;font-weight:650;letter-spacing:-.015em}
.brand small{font-size:10.5px;color:var(--mute);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:2px;background:var(--leaf);display:inline-block}
.tb .grow{flex:1}
.chip{
  height:36px;display:flex;align-items:center;gap:8px;padding:0 13px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surf);color:var(--dim);
  font-size:13px;transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--gold);color:var(--tx)}
.chip.icon{width:36px;padding:0;justify-content:center}
.chip svg{width:16px;height:16px}
.chip.acct{border-color:var(--goldd);color:var(--tx);padding-left:6px}
.chip.acct img{width:24px;height:24px;border-radius:4px;image-rendering:pixelated;background:var(--surf3)}
.wc{display:flex;gap:2px;margin-left:6px}
.wc button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.wc button:hover{background:var(--surf2);color:var(--tx)}
.wc button.x:hover{background:#5B2620;color:#fff}

/* view */
.view{flex:1;min-height:0;position:relative;z-index:1;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:22px 26px 26px;animation:in .22s ease both}
.page.flush{padding:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- play ---------- */
.play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.shaft{
  position:absolute;top:-10%;left:50%;transform:translateX(-50%);
  width:420px;height:120%;pointer-events:none;
  background:linear-gradient(180deg,rgba(229,179,63,.16),rgba(229,179,63,.04) 45%,transparent 78%);
  filter:blur(26px);
}
.canopy{position:absolute;top:0;left:0;right:0;height:180px;pointer-events:none;color:#0B130E;opacity:.85}
.nameplate{
  position:relative;background:rgba(6,10,8,.82);border:1px solid var(--line2);
  padding:7px 16px;border-radius:8px;font-size:19px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px;margin-bottom:6px;
}
.nameplate svg{width:16px;height:16px;color:var(--gold)}
.body-render{
  position:relative;height:290px;image-rendering:pixelated;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.6));
}
.body-render.ghost{opacity:.28;filter:grayscale(1) drop-shadow(0 22px 26px rgba(0,0,0,.6))}
.launchbar{position:relative;display:flex;margin-top:28px;width:430px;max-width:80vw}
.launchbtn{
  flex:1;border-radius:var(--r) 0 0 var(--r);padding:15px 20px;text-align:center;
  background:linear-gradient(180deg,#EBBE52,#C1902A);color:#1A1206;
  border:1px solid #F0CB74;border-right:0;
  box-shadow:0 10px 26px -8px rgba(229,179,63,.55),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .1s,filter .15s,box-shadow .15s;
}
.launchbtn b{display:block;font-size:20px;font-weight:700;letter-spacing:.01em}
.launchbtn small{display:block;font-size:11.5px;opacity:.72;margin-top:1px}
.launchbtn:hover{filter:brightness(1.07);box-shadow:0 14px 32px -8px rgba(229,179,63,.7)}
.launchbtn:active{transform:translateY(2px);box-shadow:0 4px 14px -6px rgba(229,179,63,.5)}
.launchdrop{
  width:56px;border-radius:0 var(--r) var(--r) 0;display:grid;place-items:center;
  background:linear-gradient(180deg,#C79A33,#9E741F);border:1px solid #F0CB74;color:#1A1206;
}
.launchdrop:hover{filter:brightness(1.1)}
.launchbtn:disabled,.launchdrop:disabled{filter:grayscale(.5) brightness(.75);cursor:progress}
.psel{
  position:absolute;bottom:100%;margin-bottom:9px;left:0;right:0;
  background:var(--surf);border:1px solid var(--line2);border-radius:var(--r);
  padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);max-height:260px;overflow-y:auto;
}
.psel button{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;text-align:left;
}
.psel button:hover{background:var(--surf3)}
.psel button.on{background:rgba(229,179,63,.12)}
.progress{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:430px;max-width:80vw;
}
.bar{height:4px;border-radius:4px;background:var(--surf3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.progress p{font-size:12px;color:var(--dim);margin-top:8px;text-align:center}

/* ---------- generic ---------- */
.row{display:flex;align-items:center;gap:10px}
.bartop{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.seg button{
  padding:8px 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf);color:var(--dim);font-size:13px;transition:.15s;
}
.seg button:hover{border-color:var(--line2);color:var(--tx)}
.seg button.on{border-color:var(--gold);color:var(--gold);background:rgba(229,179,63,.08)}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;
  border:1px solid var(--line);border-radius:9px;background:var(--bg2);transition:border-color .15s;
}
.search:focus-within{border-color:var(--gold)}
.search svg{width:15px;height:15px;color:var(--mute);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:13.5px}
.search input::placeholder{color:var(--mute)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surf);font-size:13px;transition:.15s;
}
.btn:hover{border-color:var(--gold);background:var(--surf3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(180deg,#EBBE52,#C4932C);color:#1A1206;border-color:#F0CB74;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dang{color:#E88478;border-color:#4E2620}
.btn.dang:hover{background:#3A1C17;border-color:var(--clay)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--surf2);color:var(--tx)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:12px}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;
  background:var(--surf3);color:var(--dim);font-size:11px;
}
.tag.leaf{color:var(--leaf);background:rgba(88,200,126,.1)}
.tag.gold{color:var(--gold);background:rgba(229,179,63,.1)}
.num{font-variant-numeric:tabular-nums}

.empty{
  max-width:420px;margin:64px auto;text-align:center;
}
.empty .ill{width:74px;height:74px;margin:0 auto 18px;color:var(--line2)}
.empty h3{font-size:17px;font-weight:600;margin-bottom:7px}
.empty p{color:var(--dim);font-size:13.5px;margin-bottom:18px}

.skel{background:linear-gradient(90deg,var(--surf),var(--surf3),var(--surf));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

/* profile rows */
.prow{
  display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:9px;
  background:var(--surf);border:1px solid var(--line);border-radius:12px;transition:.15s;
}
.prow:hover{border-color:var(--line2);background:var(--surf2)}
.prow.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.picon{
  width:52px;height:52px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:26px;background:var(--surf3);border:1px solid var(--line2);
}
.pinfo{flex:1;min-width:0}
.pinfo h4{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.pinfo .meta{display:flex;gap:9px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--mute)}

/* mods */
.modlayout{display:grid;grid-template-columns:1fr 236px;gap:18px;align-items:start}
@media(max-width:940px){.modlayout{grid-template-columns:1fr}.filters{display:none}}
.mrow{display:flex;gap:14px;padding:13px;margin-bottom:9px;background:var(--surf);border:1px solid var(--line);border-radius:12px;transition:.15s}
.mrow:hover{border-color:var(--line2)}
.mrow>img{width:62px;height:62px;border-radius:9px;flex:none;object-fit:cover;background:var(--surf3)}
.mrow .body{flex:1;min-width:0}
.mrow h4{font-size:14.5px;font-weight:600}
.mrow h4 span{font-weight:400;color:var(--mute);font-size:12.5px}
.mrow p{font-size:12.5px;color:var(--dim);margin:4px 0 7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fgroup{border-bottom:1px solid var(--line);padding:11px 0}
.fgroup:last-child{border-bottom:0}
.fgroup>button{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.fgroup .opts{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);cursor:pointer}
.opt input{accent-color:var(--gold);width:14px;height:14px}

/* skins */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.scard{
  border:1px solid var(--line);border-radius:12px;background:var(--surf);
  padding:16px;display:flex;flex-direction:column;align-items:center;gap:11px;transition:.15s;position:relative;
}
.scard:hover{border-color:var(--line2)}
.scard.on{border-color:var(--gold)}
.scard.add{border-style:dashed;cursor:pointer;justify-content:center;min-height:270px;color:var(--dim)}
.scard.add:hover{border-color:var(--gold);color:var(--tx)}
.scard canvas,.scard img.render{height:180px;image-rendering:pixelated;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.scard b{font-size:13px;font-weight:600}
.scard .acts{display:flex;gap:6px;width:100%}
.scard .acts .btn{flex:1;justify-content:center;padding:7px}

/* friends */
.fr-layout{display:grid;grid-template-columns:288px 1fr;height:100%}
.fr-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.fr-list .hd{padding:16px;border-bottom:1px solid var(--line)}
.fr-scroll{flex:1;overflow-y:auto;padding:8px}
.frow{display:flex;align-items:center;gap:11px;padding:9px;border-radius:9px;width:100%;text-align:left;transition:.12s}
.frow:hover{background:var(--surf2)}
.frow.on{background:var(--surf3)}
.frow img{width:36px;height:36px;border-radius:7px;image-rendering:pixelated;background:var(--surf3)}
.frow .st{font-size:11.5px;color:var(--mute)}
.frow .st.on{color:var(--leaf)}
.chat{display:flex;flex-direction:column;min-height:0}
.chat .hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.chat .hd img{width:34px;height:34px;border-radius:7px;image-rendering:pixelated}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:66%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.45}
.msg.them{background:var(--surf2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:linear-gradient(180deg,#D9A93B,#B98A26);color:#1A1206;align-self:flex-end;border-bottom-right-radius:4px}
.msg time{display:block;font-size:10px;opacity:.6;margin-top:3px}
.composer{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px}
.composer input{flex:1;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);outline:none}
.composer input:focus{border-color:var(--gold)}

/* modal */
.scrim{
  position:fixed;inset:0;background:rgba(3,6,4,.72);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:50;padding:26px;animation:fade .16s both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--bg1);border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s cubic-bezier(.2,.9,.3,1.2) both;
}
.modal.wide{max-width:880px;height:600px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal>.mh{
  padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(229,179,63,.09),transparent);
}
.modal>.mh h3{font-size:16px;font-weight:600;flex:1}
.mb{padding:20px;overflow-y:auto;flex:1;min-height:0}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px}
.field input[type=text],.field select,.field textarea{
  width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg2);outline:none;transition:border-color .15s;
}
.field textarea{height:78px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:6px}
.picker{display:flex;gap:9px;flex-wrap:wrap}
.picker button{
  padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surf);
  font-size:13px;color:var(--dim);transition:.15s;text-align:left;
}
.picker button:hover{border-color:var(--line2);color:var(--tx)}
.picker button.on{border-color:var(--gold);color:var(--gold);background:rgba(229,179,63,.08)}
.picker.icons button{font-size:24px;padding:9px 12px;line-height:1}
.setnav{width:196px;border-right:1px solid var(--line);padding:12px;flex:none;background:var(--bg2);overflow-y:auto}
.setnav button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--dim);font-size:13.5px;text-align:left;transition:.14s}
.setnav button svg{width:16px;height:16px;flex:none}
.setnav button:hover{background:var(--surf2);color:var(--tx)}
.setnav button.on{background:var(--surf3);color:var(--gold)}
.slider{width:100%;accent-color:var(--gold);margin:14px 0 6px;height:5px}
.memcard{border:1px solid var(--goldd);border-radius:11px;padding:16px;background:rgba(229,179,63,.05)}
.check{display:flex;align-items:center;gap:11px;padding:11px 0;cursor:pointer;font-size:13.5px}
.check input{width:17px;height:17px;accent-color:var(--gold);flex:none}
.h5{font-size:13px;font-weight:600;color:var(--dim);margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.h5:first-child{margin-top:0}
.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:rgba(88,200,126,.06);border:1px solid #24462F;color:var(--dim);
}
.note svg{width:16px;height:16px;flex:none;color:var(--leaf);margin-top:1px}
.note.warn{background:rgba(229,179,63,.06);border-color:#463619}
.note.warn svg{color:var(--gold)}
.code{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:26px;letter-spacing:.28em;
  text-align:center;padding:18px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line2);
  color:var(--gold);
}

/* toasts */
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:80}
.toast{
  display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:11px;font-size:13px;
  background:var(--surf2);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.5);
  animation:slide .22s cubic-bezier(.2,.9,.3,1.2) both;max-width:340px;
}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast svg{width:17px;height:17px;flex:none}
.toast.ok svg{color:var(--leaf)} .toast.err svg{color:var(--clay)} .toast.info svg{color:var(--gold)}
.locked{max-width:430px;margin:auto;text-align:center;padding:40px 0}
</style>

<div id="app">
  <nav class="rail">
    <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle cx="10" cy="17" r="7" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="38" cy="17" r="7" stroke="currentColor" stroke-width="2.6"/>
      <path d="M24 6c9 0 15 7 15 16s-6 20-15 20S9 31 9 22 15 6 24 6Z" stroke="currentColor" stroke-width="2.6"/>
      <ellipse cx="24" cy="30" rx="9" ry="7.5" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="19" cy="21" r="1.9" fill="currentColor"/><circle cx="29" cy="21" r="1.9" fill="currentColor"/>
    </svg>
    <div id="nav"></div>
    <div class="spacer"></div>
    <button class="navb" data-act="settings" title="Launcher settings">

<script>
/* ============================================================
   Monkey Client — launcher core
   ============================================================ */
const S = {
  tab:'play', account:null, profiles:[], selId:null,
  skins:[], capes:[], activeSkin:null,
  friends:[], requests:[], chats:{}, openChat:null, netSeeded:false,
  modTab:'mod', modQuery:'', modResults:[], modLoading:false, modErr:null,
  modFilters:{version:'', loader:'', env:''}, gameVersions:[], openFilter:'version',
  launching:null, pickerOpen:false, history:[], hpos:-1
};

const VERSIONS = ['26.2','1.21.11'];
const LOADERS  = ['vanilla','fabric'];
const ICONS_SET = ['🍌','🐒','🌴','🥥','🌿','🦧','🪵','🍃','🗿','🔥','⚔️','🧪','🏝️','🐍','☀️','🌙'];

/* True when running inside the Electron shell, false in a plain browser. */
const DESKTOP = !!(window.monkey && window.monkey.desktop);

/* ---------- persistence ---------- */
const mem = {};
async function save(){
  const blob = JSON.stringify({
    profiles:S.profiles, selId:S.selId, account:S.account,
    skins:S.skins, capes:S.capes, activeSkin:S.activeSkin,
    friends:S.friends, requests:S.requests, chats:S.chats, netSeeded:S.netSeeded
  });
  if(DESKTOP){ try{ await window.monkey.store.save(JSON.parse(blob)); return; }catch(e){} }
  try{ await window.storage.set('monkey:state', blob); }
  catch(e){ mem['monkey:state'] = blob; }
}
async function load(){
  if(DESKTOP){
    try{ const d = await window.monkey.store.load(); if(d) Object.assign(S, d); }catch(e){}
    return;
  }
  let raw = null;
  try{ const r = await window.storage.get('monkey:state'); raw = r && r.value; }
  catch(e){ raw = mem['monkey:state'] || null; }
  if(!raw) return;
  try{ Object.assign(S, JSON.parse(raw)); }catch(e){}
}

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const nfmt = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(0)+'K' : String(n||0);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function ago(ts){
  if(!ts) return 'Never played';
  const d = Date.now()-ts, m=6e4,h=36e5,dy=864e5;
  if(d<m) return 'Just now';
  if(d<h) return Math.floor(d/m)+'m ago';
  if(d<dy) return Math.floor(d/h)+'h ago';
  return Math.floor(d/dy)+'d ago';
}
const sel = () => S.profiles.find(p=>p.id===S.selId) || null;

const I = {
  play:'<path d="M6 4l14 8-14 8z"/>',
  profiles:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="11" r="2.3"/><path d="M5.6 17c.6-1.8 1.9-2.6 3.4-2.6s2.8.8 3.4 2.6M15 9.5h4M15 13.5h4"/>',

  dl:'<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>',

  box:'<path d="M12 2.8l8.5 4.7v9L12 21.2 3.5 16.5v-9z"/><path d="M3.7 7.6L12 12.2l8.3-4.6M12 12.2V21"/>',
  win:'<rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M2.5 9h19"/>',

};
const svg = (k,w=20) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ---------- toasts ---------- */
function toast(msg, kind='ok'){
  const ic = kind==='err' ? I.x : kind==='info' ? I.info : I.check;
  const t = el(`<div class="toast ${kind}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">${ic}</svg><span>${esc(msg)}</span></div>`);
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s, transform .25s'; t.style.opacity=0; t.style.transform='translateX(20px)'; setTimeout(()=>t.remove(),260); }, 3200);
}

/* ---------- modal ---------- */
let modalCleanup = null;
function openModal(html, opts={}){
  closeModal();
  const scrim = el(`<div class="scrim"></div>`);
  scrim.appendChild(el(html));
  $('#modal').appendChild(scrim);
  scrim.addEventListener('mousedown', e=>{ if(e.target===scrim && opts.dismissible!==false) closeModal(); });
  modalCleanup = opts.onClose || null;
  const f = scrim.querySelector('input,select,textarea,button');
  if(f) setTimeout(()=>f.focus(),40);
  return scrim;
}
function closeModal(){ $('#modal').innerHTML=''; if(modalCleanup){ modalCleanup(); modalCleanup=null; } }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal').firstChild) closeModal(); else if(S.pickerOpen){ S.pickerOpen=false; render(); } } });

/* ---------- background leaves ---------- */
(function leaves(){
  const shapes = ['M12 2c6 3 8 9 6 14-4 8-12 5-14 0 4 1 6-1 6-4 0-4-2-7 2-10z','M3 12c5-8 13-9 18-8-1 6-6 12-13 12-3 0-5-2-5-4z'];

  for(let i=0;i<16;i++){
    const s=8+Math.random()*16, d=22+Math.random()*30, del=-Math.random()*50;
    h+=`<svg class="leaf" viewBox="0 0 24 24" fill="currentColor" style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:${del}s"><path d="${shapes[i%2]}"/></svg>`;
  }
  $('#leaves').innerHTML=h;
})();

/* ============================================================
   Authentication — real flow described, preview mode labelled
   ============================================================ */
/* Real sign-in lives in the main process (electron/auth.js). In a plain
   browser there is no bridge, so the launcher falls back to preview mode. */
let netConnected = false;

const STAGE_TEXT = {
  'requesting-code': 'Asking Microsoft for a code',
  'awaiting-user'  : 'Waiting for you to approve the sign-in',
  'xbox'           : 'Authenticating with Xbox Live',
  'minecraft'      : 'Exchanging tokens with Minecraft services',
  'profile'        : 'Reading your Minecraft profile'
};

function authScreen({code, uri, stage, error}){
  return `<div class="modal" style="max-width:520px">
    <div class="mh">${svg('link',18)}<h3>Sign in to Minecraft</h3>
      <button class="btn ghost" data-act="cancel-signin">${svg('x',16)}</button></div>
    <div class="mb">
      ${error ? `<div class="note warn" style="margin-bottom:16px">${svg('info',16)}<div>
          <b style="color:var(--tx)">${esc(error.message)}</b>
          ${error.hint?`<br>${esc(error.hint)}`:''}</div></div>`
        : `<p style="color:var(--dim);font-size:13.5px;margin-bottom:16px">
             Your password is entered on Microsoft's own page. Monkey Client never sees it.</p>`}
      ${code ? `<div class="code">${esc(code)}</div>
        <p style="text-align:center;color:var(--dim);font-size:12.5px;margin:12px 0 4px">
          Enter it at <button data-act="open-verify" data-uri="${esc(uri)}"
            style="color:var(--gold);text-decoration:underline">${esc(uri)}</button></p>` : ''}
      <p style="text-align:center;color:var(--mute);font-size:12.5px;margin-top:14px">
        ${esc(STAGE_TEXT[stage] || 'Starting sign-in')}…</p>
    </div>
    <div class="mf">
      <button class="btn" data-act="cancel-signin">Cancel</button>
      ${error ? '<button class="btn pri" data-act="signin">Try again</button>' : ''}
    </div></div>`;
}

async function realSignIn(){
  let ctx = {stage:'requesting-code'};
  openModal(authScreen(ctx), {dismissible:false, onClose:()=>window.monkey.auth.cancel()});
  const off = window.monkey.auth.onProgress(p => {
    ctx = {stage:p.stage, code:p.userCode||ctx.code, uri:p.verificationUri||ctx.uri};
    const m = $('#modal .modal');
    if(m) m.outerHTML = authScreen(ctx);
    if(p.stage==='awaiting-user' && p.verificationUri) window.monkey.openExternal(p.verificationUri);
  });
  const r = await window.monkey.auth.signIn();
  off();
  if(r.ok){
    S.account = r.account;
    modalCleanup = null;
    closeModal(); save(); render();
    toast(`Signed in as ${r.account.name}`);
  } else if(r.code !== 'cancelled'){
    modalCleanup = null;
    openModal(authScreen({error:r}), {dismissible:true});
  } else {
    modalCleanup = null; closeModal();
  }
}

function signInModal(){
  if(DESKTOP) return realSignIn();
  openModal(`
    <div class="modal" style="max-width:520px">
      <div class="mh">${svg('link',18)}<h3>Sign in to Minecraft</h3>
        <button class="btn ghost" data-act="close">${svg('x',16)}</button></div>
      <div class="mb">
        <p style="color:var(--dim);font-size:13.5px;margin-bottom:16px">
          Monkey Client uses Microsoft's device-code sign-in. Your password is entered on
          Microsoft's own page, never here.</p>
        <div class="code">MONKE-4B2Q</div>
        <p style="text-align:center;color:var(--dim);font-size:12.5px;margin:12px 0 18px">
          Enter this code at <span style="color:var(--gold)">microsoft.com/link</span></p>
        <div class="note warn">${svg('info',16)}<div>
          <b style="color:var(--tx)">This step needs the desktop build.</b><br>
          Microsoft and Mojang block their token endpoints from web pages, so the real
          exchange has to run in the Electron/Tauri shell with your own Azure client ID.
          The code above is a placeholder, not a live session.</div></div>
      </div>
      <div class="mf">
        <button class="btn" data-act="close">Cancel</button>
        <button class="btn pri" data-act="preview-signin">Continue in preview mode</button>
      </div>
    </div>`);
}

async function previewSignIn(){
  closeModal();
  openModal(`
    <div class="modal" style="max-width:440px">
      <div class="mh"><h3>Preview mode</h3></div>
      <div class="mb">
        <p style="color:var(--dim);font-size:13.5px;margin-bottom:16px">
          Enter a Minecraft username to load its public skin and explore the account-gated
          screens. Nothing is authenticated and no token is issued.</p>
        <div class="field"><label for="ign">Minecraft username</label>
          <input type="text" id="ign" placeholder="This_Monke" autocomplete="off"></div>
      </div>
      <div class="mf">
        <button class="btn" data-act="close">Cancel</button>
        <button class="btn pri" data-act="do-preview">Load account</button>
      </div>
    </div>`);
}

async function lookupPlayer(name){
  if(DESKTOP){
    const r = await window.monkey.mc.lookup(name);
    if(!r) return {error:'notfound'};
    if(r.error) return {error:'unavailable'};
    return {name:r.name, uuid:r.id};
  }
  try{
    const r = await fetch('https://api.ashcon.app/mojang/v2/user/'+encodeURIComponent(name));
    if(r.status===404) return {error:'notfound'};
    if(!r.ok) return {error:'unavailable'};
    const j = await r.json();
    return {name:j.username, uuid:j.uuid};
  }catch(e){ return {error:'unavailable'}; }
}

function signOut(){
  S.account=null; S.openChat=null;
  if(S.tab==='friends') S.tab='play';
  save(); render(); toast('Signed out','info');
}

/* ============================================================
   Chrome — rail + titlebar

const TABS = [['play','Play'],['profiles','Profiles'],['mods','Mods'],['skins','Skins'],['friends','Friends']];

function pagePlay(){

    <div class="launchbar">
      ${S.pickerOpen ? `<div class="psel">
        ${S.profiles.length ? S.profiles.map(pr=>`
          <button data-act="pick-profile" data-id="${pr.id}" class="${pr.id===S.selId?'on':''}">
            <span class="picon" style="width:34px;height:34px;font-size:17px">${pr.icon}</span>
            <span style="flex:1"><b style="font-size:13px;display:block">${esc(pr.name)}</b>
            <span class="num" style="font-size:11px;color:var(--mute)">${pr.version} · ${cap(pr.loader)}</span></span>
            ${pr.id===S.selId?svg('check',15):''}</button>`).join('')
          : `<p style="padding:14px;color:var(--mute);font-size:12.5px;text-align:center">No profiles yet</p>`}
      </div>`:''}
      <button class="launchbtn" data-act="launch" ${L?'disabled':''}>
        <b>${L?'Launching…':'Launch'}</b>
        <small>${p ? esc(p.name)+' · '+p.version+' · '+cap(p.loader) : 'Create a profile to start'}</small>
      </button>
      <button class="launchdrop" data-act="toggle-picker" ${L?'disabled':''} title="Choose profile">${svg('chev',18)}</button>
    </div>
    ${L ? `<div class="progress"><div class="bar"><i style="width:${L.pct}%"></i></div><p>${esc(L.step)}</p></div>`:''}
  </div>`;
}

const LAUNCH_STEPS = [
  'Checking Java runtime', 'Fetching version manifest', 'Verifying game libraries',
  'Downloading assets', 'Resolving mod loader', 'Building classpath'
];
function launch(){
  const p = sel();
  if(!p){ S.tab='profiles'; render(); toast('Create a profile first, then launch','info'); return; }
  S.pickerOpen=false;
  S.launching={profile:p.name, pct:0, step:LAUNCH_STEPS[0]};
  render();
  let i=0;
  const tick = setInterval(()=>{
    i++;
    if(i<LAUNCH_STEPS.length){
      S.launching.pct = Math.round(i/LAUNCH_STEPS.length*88);
      S.launching.step = LAUNCH_STEPS[i];
      render();
    }else{
      clearInterval(tick);
      S.launching=null;
      p.lastPlayed=Date.now(); save(); render();
      openModal(`<div class="modal" style="max-width:480px">
        <div class="mh">${svg('box',18)}<h3>Ready to hand off to Java</h3></div>
        <div class="mb">
          <p style="color:var(--dim);font-size:13.5px;margin-bottom:14px">
            Everything up to the launch command is profile logic and runs here. Spawning the
            Java process is the one part a web page can't do.</p>
          <div class="note warn">${svg('info',16)}<div>The desktop shell runs this profile as:<br>
            <span style="font-family:ui-monospace,monospace;font-size:11.5px;color:var(--gold)">
            java -Xmx${p.settings.ram}M ${p.settings.customArgs?esc(p.settings.javaArgs):'-XX:+UseG1GC'}
            -cp &lt;libs&gt; net.minecraft.client.main.Main --version ${p.version}

  list = list.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.lastPlayed||0)-(a.lastPlayed||0));

const MOD_TABS = [['mod','Mods'],['modpack','Modpacks'],['resourcepack','Resource packs'],['shader','Shaders'],['datapack','Data packs']];

async function fetchGameVersions(){
  if(S.gameVersions.length) return;
  try{
    const r = await fetch('https://api.modrinth.com/v2/tag/game_version');
    const j = await r.json();
    S.gameVersions = j.filter(v=>v.version_type==='release').map(v=>v.version).slice(0,40);
  }catch(e){ S.gameVersions = VERSIONS.slice(); }
}

async function searchMods(){
  S.modLoading=true; S.modErr=null; render();
  const f=[['project_type:'+S.modTab]];
  if(S.modFilters.version) f.push(['versions:'+S.modFilters.version]);
  if(S.modFilters.loader)  f.push(['categories:'+S.modFilters.loader]);
  if(S.modFilters.env==='client') f.push(['client_side:required']);
  if(S.modFilters.env==='server') f.push(['server_side:required']);
  const url = `https://api.modrinth.com/v2/search?limit=20&index=${S.modQuery?'relevance':'downloads'}`
    + `&query=${encodeURIComponent(S.modQuery)}&facets=${encodeURIComponent(JSON.stringify(f))}`;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    S.modResults = j.hits || [];
  }catch(e){
    S.modErr = 'Modrinth did not respond. Check your connection and search again.';
    S.modResults = [];
  }
  S.modLoading=false; render();
}

async function installMod(pid){
  const p = sel();
  if(!p){ toast('Select a profile first','err'); S.tab='profiles'; render(); return; }
  const hit = S.modResults.find(h=>h.project_id===pid); if(!hit) return;
  if(p.loader==='vanilla' && S.modTab==='mod'){
    toast(`${p.name} is Vanilla — switch it to Fabric to install mods`,'err'); return;
  }
  if(p.mods.some(m=>m.projectId===pid)){ toast('Already installed on this profile','info'); return; }
  toast(`Resolving ${hit.title}…`,'info');
  try{
    const loaders = JSON.stringify([p.loader]);
    const vers = JSON.stringify([p.version]);
    const r = await fetch(`https://api.modrinth.com/v2/project/${pid}/version`
      + `?loaders=${encodeURIComponent(loaders)}&game_versions=${encodeURIComponent(vers)}`);
    const list = await r.json();
    if(!Array.isArray(list) || !list.length){
      toast(`${hit.title} has no ${cap(p.loader)} build for ${p.version}`,'err'); return;
    }
    const v = list[0], file = v.files.find(f=>f.primary) || v.files[0];
    p.mods.push({ id:uid(), projectId:pid, title:hit.title, icon:hit.icon_url,
      version:v.version_number, fileName:file.filename, url:file.url, sha1:file.hashes&&file.hashes.sha1 });
    save(); render();
    toast(`Installed ${hit.title} ${v.version_number} to ${p.name}`);
  }catch(e){ toast('Could not reach Modrinth for that mod','err'); }
}

function drawSkin(canvas, src){
  const img = new Image(); img.crossOrigin='anonymous';
  img.onload = () => {
    const S3=7, ctx=canvas.getContext('2d');
    canvas.width=16*S3; canvas.height=32*S3;
    ctx.imageSmoothingEnabled=false;
    const legacy = img.height===32;
    const put=(sx,sy,sw,sh,dx,dy,flip)=>{
      ctx.save();
      if(flip){ ctx.translate((dx+sw)*S3,0); ctx.scale(-1,1); dx=0; }
      ctx.drawImage(img,sx,sy,sw,sh,dx*S3,dy*S3,sw*S3,sh*S3);
      ctx.restore();
    };
    put(8,8,8,8,4,0);                                   // head
    put(20,20,8,12,4,8);                                // torso
    put(44,20,4,12,0,8);                                // right arm
    legacy ? put(44,20,4,12,12,8,true) : put(36,52,4,12,12,8);   // left arm
    put(4,20,4,12,4,20);                                // right leg
    legacy ? put(4,20,4,12,8,20,true) : put(20,52,4,12,8,20);    // left leg
    put(40,8,8,8,4,0);                                  // hat
    if(!legacy){ put(20,36,8,12,4,8); put(44,36,4,12,0,8);
      put(52,52,4,12,12,8); put(4,36,4,12,4,20); put(4,52,4,12,8,20); }
  };
  img.onerror = () => { canvas.replaceWith(el(`<div style="height:180px;display:grid;place-items:center;color:var(--mute);font-size:12px">Preview unavailable</div>`)); };
  img.src = src;
}

function hydrateSkins(){ document.querySelectorAll('canvas[data-skin]').forEach(c=>drawSkin(c,c.dataset.src)); }

let pickMode=null;
async function pickFile(mode){
  if(DESKTOP){
    const f = await window.monkey.pickPng();
    if(!f) return;
    const item = {id:uid(), name:f.name.replace(/\.png$/i,''), data:f.data};
    if(mode==='skin'){ S.skins.push(item); toast('Skin added'); }
    else { S.capes.push(item); toast('Cape added'); }
    save(); render(); return;
  }
  pickMode=mode; $('#filepick').click();
}
$('#filepick').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    if(pickMode==='skin'){ S.skins.push({id:uid(), name:f.name.replace(/\.png$/i,''), data:fr.result}); toast('Skin added'); }
    else { S.capes.push({id:uid(), name:f.name.replace(/\.png$/i,''), data:fr.result}); toast('Cape added'); }
    save(); render();
  };
  fr.readAsDataURL(f); e.target.value='';
};

const MonkeyNet = {
  get connected(){ return netConnected; },
  async call(method, ...args){
    if(!DESKTOP) return {ok:false, message:'MonkeyNet needs the desktop build.'};
    return window.monkey.net.call(method, ...args);
  },
  async sendRequest(ign){ return this.call('addFriend', ign); },
  async sendMessage(id, text){ return this.call('send', id, text); }
};

async function refreshNet(){
  if(!netConnected) return;
  const f = await MonkeyNet.call('friends');
  const r = await MonkeyNet.call('requests');
  if(f.ok) S.friends = f.data.friends.map(u=>({
    id:u.uuid, ign:u.name, online:u.online, status:u.online?'Online':'Offline'}));
  if(r.ok) S.requests = r.data.requests.map(x=>({id:x.id, ign:x.name, uuid:x.uuid}));
  render();
}

function handleNetEvent(ev){
  if(ev.type==='presence'){
    const f = S.friends.find(x=>x.id===ev.uuid);
    if(f){ f.online=ev.online; f.status=ev.online?'Online':'Offline'; render(); }
  }
  if(ev.type==='message'){
    (S.chats[ev.from] = S.chats[ev.from]||[]).push({me:false, t:ev.text, at:ev.at});
    save(); render();
    if(S.openChat!==ev.from) toast(`${ev.name}: ${ev.text.slice(0,40)}`,'info');
  }
  if(ev.type==='message-sent'){
    (S.chats[ev.to] = S.chats[ev.to]||[]).push({me:true, t:ev.text, at:ev.at});
    save(); render();
  }
  if(ev.type==='friend-request'){ toast(`${ev.from.name} sent a friend request`,'info'); refreshNet(); }
  if(ev.type==='friend-added' || ev.type==='friend-removed') refreshNet();
  if(ev.type==='disconnected'){ netConnected=false; render(); toast('MonkeyNet disconnected','err'); }
}

function seedNet(){
  if(S.netSeeded || netConnected) return;
  S.friends = [
    {id:'f1', ign:'Technoblade', online:true,  status:'In Jungle SMP'},

  S.netSeeded = true;
}

function render(){
  renderChrome();
  const v = $('#view');
  const map = {play:pagePlay, profiles:pageProfiles, mods:pageMods, skins:pageSkins, friends:pageFriends};
  v.innerHTML = (map[S.tab]||pagePlay)();
  if(S.tab==='skins') hydrateSkins();
  const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight;
  const pq = $('#pq'); if(pq){ pq.oninput = e=>{ pQuery=e.target.value; render(); $('#pq').focus(); }; }
  const mq = $('#mq'); if(mq){ mq.onkeydown = e=>{ if(e.key==='Enter'){ S.modQuery=mq.value; searchMods(); } };
    mq.oninput = e=>{ S.modQuery=e.target.value; }; }
  const mi = $('#msgin'); if(mi){ mi.onkeydown = e=>{ if(e.key==='Enter') sendMsg(); }; }
  const iq = $('#ignq'); if(iq){ iq.onkeydown = e=>{ if(e.key==='Enter') fetchSkin(); }; }
}

function go(tab){
  if(S.tab===tab) return;
  S.tab=tab; S.pickerOpen=false;
  if(tab==='mods' && !S.modResults.length && !S.modLoading){ fetchGameVersions().then(searchMods); }
  render();
}

function sendMsg(){
  const inp=$('#msgin'); if(!inp || !inp.value.trim() || !S.openChat) return;
  const text = inp.value.trim();
  inp.value='';
  if(netConnected){ MonkeyNet.sendMessage(S.openChat, text); return; }
  (S.chats[S.openChat] = S.chats[S.openChat]||[]).push({me:true, t:text, at:Date.now()});
  save(); render();
  toast('Saved locally — MonkeyNet is not connected','info');
}

async function fetchSkin(){
  const inp=$('#ignq'); const name=(inp&&inp.value||'').trim();
  if(!name){ toast('Type a username first','err'); return; }
  toast('Looking up '+name+'…','info');
  const r = await lookupPlayer(name);
  if(r.error==='notfound'){ toast(`No Minecraft account named ${name}`,'err'); return; }
  if(r.error){ toast('Mojang lookup is unreachable right now','err'); return; }
  if(S.skins.some(s=>s.ign===r.name)){ toast(`${r.name}'s skin is already saved`,'info'); return; }
  S.skins.push({id:uid(), name:r.name, ign:r.name});
  save(); render(); toast(`Added ${r.name}'s skin`);
}

document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-tab]');
  if(nav){ go(nav.dataset.tab); return; }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;

  switch(a){
    case 'close': closeModal(); break;
    case 'win-minimize': case 'win-maximize': case 'win-close':
      if(DESKTOP) window.monkey.window(a.replace('win-','')); break;
    case 'cancel-signin':
      if(DESKTOP) window.monkey.auth.cancel();
      modalCleanup = null; closeModal(); break;
    case 'open-verify':
      if(DESKTOP) window.monkey.openExternal(t.dataset.uri); break;
    case 'go-play': go('play'); break;
    case 'signin': closeModal(); signInModal(); break;
    case 'preview-signin': previewSignIn(); break;
    case 'do-preview': {
      const name = ($('#ign').value||'').trim() || 'This_Monke';
      const r = await lookupPlayer(name);
      S.account = { name: r.name || name, uuid: r.uuid || null, preview:true };
      seedNet(); save(); closeModal(); render();
      toast(`Preview session for ${S.account.name}`, 'info');
      break; }
    case 'account-menu':
      openModal(`<div class="modal" style="max-width:380px">
        <div class="mh"><h3>${esc(S.account.name)}</h3>
          <button class="btn ghost" data-act="close">${svg('x',16)}</button></div>
        <div class="mb" style="text-align:center">
          <img src="https://mc-heads.net/body/${encodeURIComponent(S.account.name)}/180"
            style="image-rendering:pixelated;margin-bottom:14px" alt="">
          <p style="font-size:12px;color:var(--mute);word-break:break-all">${esc(S.account.uuid||'UUID unavailable')}</p>
          ${S.account.preview?`<div class="note warn" style="margin-top:14px">${svg('info',16)}
            <div>Preview session. No Microsoft token is held.</div></div>`:''}
        </div>
        <div class="mf"><button class="btn dang" data-act="signout">${svg('logout',15)}Sign out</button></div></div>`);
      break;
    case 'signout':
      closeModal();
      if(DESKTOP) await window.monkey.auth.signOut();
      netConnected = false;
      signOut(); break;

    /* play */
    case 'toggle-picker': S.pickerOpen=!S.pickerOpen; render(); break;
    case 'pick-profile': S.selId=id; S.pickerOpen=false; save(); render(); break;
    case 'launch': launch(); break;

    /* profiles */
    case 'pfilter': pFilter=t.dataset.k; render(); break;
    case 'new-profile': newProfileModal(); break;
    case 'np-v': window.__np.v=t.dataset.v; newProfileModal(window.__np); break;
    case 'np-l': window.__np.l=t.dataset.l; newProfileModal(window.__np); break;
    case 'np-i': window.__np.i=t.dataset.i; newProfileModal(window.__np); break;
    case 'np-save': createProfile(window.__np); break;
    case 'play-profile': S.selId=id; save(); go('play'); launch(); break;
    case 'profile-mods': S.selId=id; save(); go('mods'); break;
    case 'profile-settings': setTab='general'; settingsModal(id); break;

    /* settings */
    case 'set-tab': setTab=t.dataset.k; settingsModal(setId); break;
    case 's-icon': { const p=S.profiles.find(x=>x.id===setId); p.icon=t.dataset.i; settingsModal(setId); break; }
    case 's-save': saveSettings(); break;
    case 's-delete': {
      const p=S.profiles.find(x=>x.id===setId);
      S.profiles = S.profiles.filter(x=>x.id!==setId);
      if(S.selId===setId) S.selId = S.profiles[0]?S.profiles[0].id:null;
      save(); closeModal(); render(); toast(`Deleted ${p.name}`); break; }
    case 'rm-mod': {
      const p=S.profiles.find(x=>x.id===setId);
      p.mods = p.mods.filter(m=>m.id!==t.dataset.mid);
      save(); settingsModal(setId); toast('Mod removed'); break; }

    /* mods */
    case 'modtab': S.modTab=t.dataset.k; searchMods(); break;
    case 'mod-search': S.modQuery = ($('#mq')&&$('#mq').value)||''; searchMods(); break;
    case 'fgroup': S.openFilter = S.openFilter===t.dataset.k ? null : t.dataset.k; render(); break;
    case 'install': installMod(t.dataset.pid); break;

    /* skins */
    case 'upload-skin': pickFile('skin'); break;
    case 'upload-cape': pickFile('cape'); break;
    case 'fetch-skin': fetchSkin(); break;
    case 'apply-skin': {
      if(!S.account){ toast('Sign in to apply a skin to your account','err'); signInModal(); break; }
      const skin = S.skins.find(x=>x.id===id);
      S.activeSkin=id; save(); render();
      if(!DESKTOP){ toast('Selected. Uploading to Mojang needs the desktop build','info'); break; }
      if(!skin.data){ toast('Only uploaded files can be applied — that one is a lookup','err'); break; }
      toast('Uploading to Mojang…','info');
      const up = await window.monkey.mc.uploadSkin(skin.data, 'classic');
      toast(up.ok ? 'Skin applied to your account' : up.message, up.ok ? 'ok' : 'err');
      break; }
    case 'del-skin': S.skins=S.skins.filter(s=>s.id!==id);
      if(S.activeSkin===id) S.activeSkin=null; save(); render(); toast('Skin removed'); break;
    case 'del-cape': S.capes=S.capes.filter(c=>c.id!==id); save(); render(); toast('Cape removed'); break;

    /* friends */
    case 'go-requests':
      if(!S.account){ toast('Sign in to see friend requests','err'); signInModal(); break; }
      requestsModal(); break;
    case 'add-friend': addFriendModal(); break;
    case 'do-add-friend': {
      const name=($('#afi').value||'').trim();
      const box=$('#aferr');
      if(!name){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>Enter a username first.</div></div>`; break; }
      box.innerHTML=`<p style="color:var(--mute);font-size:12.5px">Checking ${esc(name)}…</p>`;
      const r = await lookupPlayer(name);
      if(r.error==='notfound'){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>No Minecraft account named <b style="color:var(--tx)">${esc(name)}</b>. Check the spelling.</div></div>`; break; }
      if(r.error){ box.innerHTML=`<div class="note warn">${svg('info',16)}<div>Mojang is unreachable, so the username can't be verified right now.</div></div>`; break; }
      if(S.friends.some(f=>f.ign===r.name)){ box.innerHTML=`<div class="note">${svg('info',16)}<div>${esc(r.name)} is already your friend.</div></div>`; break; }
      const sent = await MonkeyNet.sendRequest(r.name);
      if(MonkeyNet.connected && !sent.ok){
        box.innerHTML=`<div class="note warn">${svg('info',16)}<div>${esc(sent.message)}</div></div>`; break; }
      closeModal();
      if(MonkeyNet.connected){ toast(`Request sent to ${r.name}`); refreshNet(); }
      else toast(`${r.name} verified — start MonkeyNet to send the request`, 'info');
      break; }
    case 'accept-req': {
      const r=S.requests.find(x=>x.id===id);
      if(netConnected){
        const res = await MonkeyNet.call('acceptRequest', id);
        closeModal();
        if(res.ok){ await refreshNet(); toast(`${r.ign} is now your friend`); }
        else toast(res.message,'err');
        break; }
      S.requests=S.requests.filter(x=>x.id!==id);
      S.friends.push({id:uid(), ign:r.ign, online:false, status:'Offline'});
      save(); requestsModal(); render(); toast(`${r.ign} is now your friend`); break; }
    case 'decline-req': {
      const r=S.requests.find(x=>x.id===id);
      if(netConnected){
        await MonkeyNet.call('declineRequest', id);
        closeModal(); await refreshNet(); toast(`Declined ${r.ign}`,'info');
        break; }
      S.requests=S.requests.filter(x=>x.id!==id);
      save(); requestsModal(); render(); toast(`Declined ${r.ign}`,'info'); break; }
    case 'open-chat': {
      S.openChat=id; render();
      if(netConnected){
        const h = await MonkeyNet.call('history', id);
        if(h.ok){ S.chats[id] = h.data.messages; render(); }
      }
      break; }
    case 'send-msg': sendMsg(); break;

    case 'settings':
      openModal(`<div class="modal" style="max-width:460px">
        <div class="mh">${svg('gear',18)}<h3>Launcher settings</h3>
          <button class="btn ghost" data-act="close">${svg('x',16)}</button></div>
        <div class="mb">
          <div class="field"><label>Instance folder</label>
            <input type="text" value="%APPDATA%\\MonkeyClient" readonly></div>
          <label class="check"><input type="checkbox" checked><span>Check for updates on start</span></label>
          <label class="check"><input type="checkbox" checked><span>Keep the launcher open after launching</span></label>
          <div class="h5">Stored data</div>
          <button class="btn dang" data-act="wipe">${svg('trash',15)}Reset all launcher data</button>
        </div></div>`);
      break;
    case 'wipe':
      S.profiles=[]; S.selId=null; S.skins=[]; S.capes=[]; S.friends=[]; S.requests=[];
      S.chats={}; S.account=null; S.netSeeded=false; S.activeSkin=null;
      save(); closeModal(); S.tab='play'; render(); toast('Launcher data reset','info');
      break;
  }
});

(async function(){
  await load();
  if(S.profiles.length && !S.profiles.find(p=>p.id===S.selId)) S.selId=S.profiles[0].id;
  S.tab='play'; S.launching=null; S.pickerOpen=false;

  if(DESKTOP){
    window.monkey.auth.onRestored(acc => {
      S.account = acc; save(); render();
      toast(`Welcome back, ${acc.name}`);
    });
    window.monkey.auth.onRestoreFailed(({message}) => {
      S.account = null; render(); toast(message, 'info');
    });
    window.monkey.net.onStatus(({connected, message}) => {
      netConnected = connected;
      if(connected){ S.netSeeded = true; refreshNet(); }
      else if(message) toast('MonkeyNet: '+message, 'info');
    });
    window.monkey.net.onEvent(handleNetEvent);
    const acc = await window.monkey.auth.account();
    if(acc) S.account = acc;
  }
  render();
})();
</script>
